# CraftWater patcher - base source definition
# The patcher downloads this zip, verifies sha256, extracts it as the pristine base,
# then applies the patches from the .cw pack. No Minecraft source is stored in this repo.

base.name=CraftBukkit 1.2.5-R5.0

# Where the patch pack lives. The patcher reads the release list from GitHub:
#   - GitHub Releases (tag = version, assets = manifest.yml + *.cw), else
#   - a pack.yml committed in the repo tree.
pack.owner=99965bs
pack.repo=CraftWater-patches
pack.ref=main
# Optional: a GitHub token raises the API rate limit (60/hour -> 5000/hour).
pack.token=

base.version=1.2.5-R5.0
base.url=https://drive.usercontent.google.com/u/0/uc?id=1HCQlWMPhEsQ0Uo6PZY_HloWtx2OM_9C_&export=download
base.sha256=3db139dbfec28742da3c70b07bbb93d48d277d0791f0cfa31f8fba8d6bc422f1
base.root=CraftBukkit-1.2.5-R5.0

# Maven dependencies (installed into the local repo by the patcher before building)
dep.bukkit.url=https://maven.enginehub.org/repo/org/bukkit/bukkit/1.2.5-R5.0/bukkit-1.2.5-R5.0.jar
dep.bukkit.group=org.bukkit
dep.bukkit.artifact=bukkit
dep.bukkit.version=1.2.5-R5.0
dep.minecraft.url=https://maven.enginehub.org/repo/org/bukkit/minecraft-server/1.2.5/minecraft-server-1.2.5.jar
dep.minecraft.group=org.bukkit
dep.minecraft.artifact=minecraft-server
dep.minecraft.version=1.2.5
